[project]
name = "exec-server-spec"
version = "0.1.0"
description = "Black-box pytest conformance tests for the shared sandbox execution protocol"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4", "pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-timeout>=2.3,<3"]

[project.scripts]
exec-server-conformance = "exec_server_spec.runner:main"

[dependency-groups]
dev = ["ruff>=0.12"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 90

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
