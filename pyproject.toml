[project]
name = "external-sandbox"
version = "0.1.0"
description = "External Sandbox protocol specification and independent pytest conformance runner"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4", "pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-timeout>=2.3,<3", "cryptography>=45,<48"]

[project.scripts]
external-sandbox-conformance = "external_sandbox.runner:main"
external-sandbox-proxy-fixture = "external_sandbox.tls_fixture:main"

[dependency-groups]
dev = ["ruff>=0.12", "websockets==17.0.1"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "claude-code/tests"]
timeout = 90

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
